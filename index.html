    <!--prepaint-->
    <script>
      //old links with a game's own parameters or a shared puzzle land on the game played last
      try {
        if (location.search || location.hash) {
          var game = 'minesweeper'
          var last = localStorage.getItem('lastGame')
          if (/^(minesweeper|takuzu|nonograms|sudoku|2048|lightup|futoshiki|bridges)$/.test(last))
            game = last
          location.replace(game + '/' + location.search + location.hash)
        }
      } catch (error) {}
    </script>
    <script type="module" src="/src/home/index.js"></script>
